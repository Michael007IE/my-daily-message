name: Send Daily Telegram Message

on:
  schedule:
    # 03:17 UTC (which is 04:17 IST in summer)
    - cron: '17 3 * * *'
    # 04:17 UTC (which is 04:17 GMT in winter)
    - cron: '17 4 * * *'
  workflow_dispatch: # Allows manual testing anytime via the "Run workflow" button

jobs:
  send_daily_digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Verify Dublin Time
        id: time_check
        run: |
          # If triggered manually, skip the time check
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check local Dublin hour
          DUBLIN_HOUR=$(TZ="Europe/Dublin" date +%H)
          if [ "$DUBLIN_HOUR" = "04" ]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping: Current Dublin hour ($DUBLIN_HOUR) is not 04."
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.time_check.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.time_check.outputs.run_job == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Message Script
        if: steps.time_check.outputs.run_job == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py