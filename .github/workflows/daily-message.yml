name: Send Daily Telegram Message

on:
  schedule:
    # 03:17 UTC -> 04:17 IST (Irish Standard Time / Summer)
    # (Adjust to '17 4 * * *' in late October when clocks fall back to GMT)
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows manual triggers anytime

jobs:
  send_daily_digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Message Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py